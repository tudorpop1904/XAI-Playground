[project]
name = "xai-playground"
version = "0.1.0"
description = "XAI Dashboard for AI-Generated Image Detection"
requires-python = ">=3.12"
dependencies = [
    # ── Deep Learning ──────────────────────────────────────────────────────────
    "torch>=2.4.0",
    "torchvision>=0.19.0",

    # ── API ───────────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "aiofiles>=23.2.0",
    "pydantic>=2.8.0",
    "requests>=2.32.0",

    # ── Frontend ──────────────────────────────────────────────────────────────
    "streamlit>=1.38.0",
    "matplotlib>=3.9.0",

    # ── Async / Message Queue ─────────────────────────────────────────────────
    "pika>=1.3.2",

    # ── AI / ML integrations ──────────────────────────────────────────────────
    "kagglehub>=0.3.0",
    "huggingface-hub>=0.24.0",
    "ollama>=0.3.0",

    # ── Image processing ──────────────────────────────────────────────────────
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",

    # ── System / Monitoring ───────────────────────────────────────────────────
    "psutil>=6.0.0",
]

# ── PyTorch CUDA index ────────────────────────────────────────────────────────
# H200 foloseste CUDA 12.x; cu124 wheels sunt compatibile cu CUDA 12.4+.
# Daca `nvcc --version` pe compute1 arata o versiune mai mare, actualizeaza la cu126 etc.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
