# ============================================================
# docker-compose.jenkins.yml — Dedicated Jenkins CI/CD Controller
# ============================================================
# Usage:
#   docker compose -f docker-compose.jenkins.yml up -d --build
#
# Ports:
#   8080  — Jenkins Web UI
#   50000 — Jenkins Inbound Agent port
# ============================================================

services:
  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    container_name: xai-jenkins
    user: root # Allows seamless access to the mounted docker.sock across different host GIDs
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    restart: unless-stopped

volumes:
  jenkins_data:
    driver: local
